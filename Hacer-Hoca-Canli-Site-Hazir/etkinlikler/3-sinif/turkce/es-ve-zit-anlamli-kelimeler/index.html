<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer Hoca - 3. Sınıf Türkçe Değerlendirmesi</title>
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border-radius: 20px;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            height: 90vh;
            max-height: 850px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 24px;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .hidden { display: none !important; }

        /* HEADER & TEACHER AVATAR */
        .header { text-align: center; margin-bottom: 20px; }
        .teacher-avatar { font-size: 4rem; line-height: 1; margin-bottom: 10px; }
        .app-title { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin: 0; }
        .app-subtitle { font-size: 1rem; color: var(--text-muted); margin: 5px 0 0 0; font-weight: 500; }

        /* WELCOME SCREEN */
        #welcome-screen { text-align: center; margin-top: auto; margin-bottom: auto; }
        input[type="text"] {
            width: 100%; padding: 16px; font-size: 1.2rem; border: 2px solid #D1D5DB;
            border-radius: 12px; margin: 20px 0; outline: none; text-align: center; transition: border 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); }
        .btn {
            background: var(--primary); color: white; border: none; padding: 16px 24px;
            font-size: 1.2rem; border-radius: 12px; width: 100%; cursor: pointer;
            font-weight: bold; transition: transform 0.1s, background 0.3s;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #9CA3AF; cursor: not-allowed; transform: none; box-shadow: none; }

        /* QUIZ SCREEN */
        .progress-bar-container { width: 100%; height: 8px; background: #E5E7EB; border-radius: 4px; margin-bottom: 20px; overflow: hidden;}
        .progress-bar { height: 100%; background: var(--secondary); width: 0%; transition: width 0.3s ease; }
        .question-meta { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.95rem; font-weight: bold; margin-bottom: 12px; }
        .question-text { font-size: 1.25rem; font-weight: 600; line-height: 1.5; margin-bottom: 24px; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background: #F9FAFB; border: 2px solid #E5E7EB; padding: 16px; border-radius: 12px;
            font-size: 1.1rem; text-align: left; cursor: pointer; transition: all 0.2s;
            position: relative; overflow: hidden; line-height: 1.4;
        }
        @media (hover: hover) { .option-btn:hover:not(:disabled) { background: #EEF2FF; border-color: #C7D2FE; } }
        .option-btn.correct { background: #D1FAE5 !important; border-color: var(--secondary) !important; color: #065F46; font-weight: bold; }
        .option-btn.wrong { background: #FEE2E2 !important; border-color: var(--danger) !important; color: #991B1B; }
        
        .feedback-box {
            margin-top: 20px; padding: 16px; border-radius: 12px; display: none; font-size: 1rem; line-height: 1.4;
            animation: slideIn 0.3s ease;
        }
        .feedback-box.hint { background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E; display: block; }
        .feedback-box.solution { background: #E0E7FF; border: 1px solid #C7D2FE; color: #3730A3; display: block; }
        
        .kazanim-label { margin-top: auto; padding-top: 20px; font-size: 0.8rem; color: #9CA3AF; text-align: center; }
        .next-btn-container { margin-top: 20px; display: none; }

        /* MID-REPORT & REPORT CARD */
        .report-screen { text-align: center; padding-bottom: 20px;}
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; background: var(--primary);
            color: white; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; font-weight: bold; margin: 0 auto 20px auto;
            border: 8px solid #E0E7FF;
        }
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px;
        }
        .stat-box { background: #F3F4F6; padding: 12px; border-radius: 12px; font-size: 0.85rem; font-weight: bold;}
        .stat-box.success { background: #D1FAE5; color: #065F46; }
        .stat-box.warning { background: #FEF3C7; color: #92400E; }
        .stat-box.danger { background: #FEE2E2; color: #991B1B; }
        .stat-num { font-size: 1.5rem; font-weight: 800; display: block; margin-top: 5px; }

        .review-box { text-align: left; margin-top: 20px; }
        .review-item {
            background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; margin-bottom: 12px;
        }
        .review-q { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; color: #1F2937; }
        .review-ans { font-size: 0.9rem; color: var(--secondary); font-weight: 600; }
        .review-exp { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .action-buttons .btn { font-size: 1rem; padding: 12px; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: #EEF2FF; }

        /* ANIMATIONS */
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .floating-emoji { position: fixed; pointer-events: none; font-size: 2rem; animation: floatUp 3s forwards ease-out; z-index: 1000; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100vh) scale(1.5); opacity: 0; } }
        
        .tear-drop { position: fixed; pointer-events: none; font-size: 2rem; animation: dropDown 2s forwards ease-in; z-index: 1000; }
        @keyframes dropDown { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(100vh) scale(0.5); opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div id="welcome-screen">
        <div class="header">
            <div class="teacher-avatar">👩‍🏫</div>
            <h1 class="app-title">Hacer Hoca</h1>
            <p class="app-subtitle">3. Sınıf Türkçe - Eş ve Zıt Anlamlılar</p>
        </div>
        <p style="color: var(--text-muted); font-size: 1.1rem; margin-top: 30px;">Değerlendirmeye başlamak için adını ve soyadını yazmalısın.</p>
        <input type="text" id="studentName" placeholder="Adın ve Soyadın" oninput="validateName()" autocomplete="off">
        <button id="startBtn" class="btn" onclick="startApp()" disabled>Sınava Başla</button>
    </div>

    <div id="quiz-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div class="progress-bar-container"><div id="progress" class="progress-bar"></div></div>
        <div class="question-meta"><span id="q-num">Soru 1/10</span><span style="color: var(--primary);">Puan: <span id="current-score-display">0</span></span></div>
        <div id="q-text" class="question-text"></div>
        <div id="options" class="options-container"></div>
        <div id="feedback" class="feedback-box"></div>
        <div id="next-btn-container" class="next-btn-container"><button class="btn" onclick="nextQuestion()">Sonraki Soru ➔</button></div>
        <div id="kazanim" class="kazanim-label"></div>
    </div>

    <div id="mid-report-screen" class="hidden report-screen" style="margin: auto 0;">
        <div class="teacher-avatar">👩‍🏫</div>
        <h2 class="app-title">Yarı Yol Molası!</h2>
        <p id="mid-message" style="margin: 20px 0; font-size: 1.1rem; line-height: 1.5;"></p>
        <button class="btn" onclick="continueFromMid()">Sınava Devam Et</button>
    </div>

    <div id="report-screen" class="hidden report-screen">
        <div class="header"><h1 class="app-title">Değerlendirme Karnesi</h1><p class="app-subtitle" id="final-name"></p></div>
        <div class="score-circle"><span id="final-score">100</span></div>
        <div class="stats-grid">
            <div class="stat-box success">İlk Hak Doğru<span id="stat-first" class="stat-num">0</span></div>
            <div class="stat-box warning">İpucuyla Doğru<span id="stat-hint" class="stat-num">0</span></div>
            <div class="stat-box danger">Geliştirilmeli<span id="stat-fail" class="stat-num">0</span></div>
        </div>
        <div class="action-buttons"><button class="btn btn-outline" onclick="location.reload()">Yeniden Başla</button></div>
        <div id="review-box" class="review-box"></div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Efe'nin çantası çok <b>ağır</b>, Can'ın çantası ise çok ___.\nBu cümlede boş bırakılan yere 'ağır' kelimesinin zıt (karşıt) anlamlısı gelmelidir. Hangi kelime gelmelidir?",
            options: ["A) hafif", "B) büyük", "C) dolu"], correct: "A) hafif", hint: "Ağır kelimesinin tam tersi olan durumu düşünmelisin.", solution: "'Ağır' kelimesinin zıt anlamlısı 'hafif'tir.", kazanim: "T.3.3.10. Kelimelerin zıt anlamlılarını bulur."
        },
        {
            q: "Öğretmenimiz 'Okul, yuvamızdır.' dedi.\n'Okul' kelimesinin yerine hangi kelimeyi kullanırsak cümlenin anlamı <b>değişmez</b>?",
            options: ["A) sınıf", "B) mektep", "C) ders"], correct: "B) mektep", hint: "Aynı anlama gelen (eş anlamlı) bir kelime arıyoruz.", solution: "Okul ve mektep aynı anlama gelen eş anlamlı kelimelerdir.", kazanim: "T.3.3.11. Kelimelerin eş anlamlılarını bulur."
        },
        {
            q: "Aşağıdaki cümlelerin hangisinde birbirinin zıttı (karşıtı) olan iki kelime bir arada kullanılmıştır?",
            options: ["A) Sabah erkenden kalkıp kahvaltısını yaptı.", "B) Yaz ve kış mevsimlerinin güzellikleri başkadır.", "C) Soğuk havalarda kalın giyinmeliyiz."], correct: "B) Yaz ve kış mevsimlerinin güzellikleri başkadır.", hint: "İki zıt kelimenin (örneğin sıcak-soğuk gibi) aynı cümlede olduğu seçeneği bulmalısın.", solution: "B seçeneğinde 'yaz' ve 'kış' kelimeleri birbirinin zıt anlamlısıdır ve aynı cümlede kullanılmıştır.", kazanim: "T.3.3.10. Kelimelerin zıt anlamlılarını bulur."
        },
        {
            q: "Eski bir masal kitabında 'kara' bir kedi ile 'ak' bir köpeğin dostluğu anlatılıyor.\n'Kara' ve 'ak' kelimelerinin <b>eş anlamlıları</b> sırasıyla hangi seçenekte verilmiştir?",
            options: ["A) Siyah - Beyaz", "B) Koyu - Açık", "C) Gece - Gündüz"], correct: "A) Siyah - Beyaz", hint: "Kara = ? , Ak = ? Eş anlamlılarını düşün.", solution: "Kara kelimesinin eş anlamlısı Siyah, Ak kelimesinin eş anlamlısı ise Beyaz'dır.", kazanim: "T.3.3.11. Kelimelerin eş anlamlılarını bulur."
        },
        {
            q: "Aşağıda bazı kelimeler ve eş anlamlıları verilmiştir:\n1. Armağan = Hediye\n2. Güz = Sonbahar\n3. Yoksul = Fakir\n4. İhtiyar = <b>?</b>\nSoru işaretli yere hangi kelime gelmelidir?",
            options: ["A) Yaşlı", "B) Genç", "C) Hasta"], correct: "A) Yaşlı", hint: "İhtiyar kelimesinin anlamdaşını (eş anlamlısını) bulmalısın.", solution: "İhtiyar kelimesi, 'yaşlı' kelimesi ile aynı anlama gelmektedir.", kazanim: "T.3.3.11. Kelimelerin eş anlamlılarını bulur."
        },
        {
            q: "Zeynep defterine şu örüntüyü yazdı:\n<i>Uzun - Kısa</i>\n<i>Sıcak - Soğuk</i>\n<i>İleri - ...</i>\nÖrüntüye göre boş bırakılan yere hangisi gelmelidir?",
            options: ["A) Ön", "B) Geri", "C) Uzak"], correct: "B) Geri", hint: "Örüntüdeki kelimeler zıt anlamlı. 'İleri' kelimesinin zıddını bulmalısın.", solution: "Uzun-Kısa ve Sıcak-Soğuk zıt anlamlıdır. İleri kelimesinin zıt anlamlısı 'Geri'dir.", kazanim: "T.3.3.10. Kelimelerin zıt anlamlılarını bulur."
        },
        {
            q: "Aşağıdaki kelime çiftlerinden hangisi aralarındaki anlam ilişkisi yönüyle <b>diğerlerinden farklıdır</b>?",
            options: ["A) Güzel - Çirkin", "B) Islak - Kuru", "C) Fayda - Yarar"], correct: "C) Fayda - Yarar", hint: "İki seçenek zıt anlamlı kelimelerden, bir seçenek ise eş anlamlı kelimelerden oluşuyor. Farklı olanı seç.", solution: "Güzel-Çirkin ve Islak-Kuru zıt anlamlıdır. Fayda-Yarar ise eş anlamlıdır.", kazanim: "T.3.3.10 ve T.3.3.11'i birlikte değerlendirir."
        },
        {
            q: "'Doktor bana bol bol su içmemi söyledi.'\ncümlesindeki 'doktor' kelimesinin yerine hangisi gelirse cümlenin anlamı <b>bozulmaz</b>?",
            options: ["A) Hemşire", "B) Hekim", "C) Eczacı"], correct: "B) Hekim", hint: "Doktor ile aynı işi yapan, doktorla aynı anlama gelen kelimeyi arıyoruz.", solution: "Doktor ve hekim eş anlamlı kelimelerdir. Cümlede birbirinin yerine kullanılabilirler.", kazanim: "T.3.3.11. Kelimelerin eş anlamlılarını bulur."
        },
        {
            q: "Deniz, kitabını okuduktan sonra şöyle dedi: 'Bu kitap hiç de <b>sıkıcı</b> değilmiş!'\nBoşluğa 'sıkıcı' kelimesinin <b>zıt anlamlısı</b> gelirse, hangi kelime en uygun olur?",
            options: ["A) üzücü", "B) eğlenceli", "C) yorucu"], correct: "B) eğlenceli", hint: "Sıkıcı kelimesinin tam tersini düşünmelisin.", solution: "Sıkıcı kelimesinin zıt anlamlısı 'eğlenceli' (veya keyifli) kelimesidir.", kazanim: "T.3.3.10. Kelimelerin zıt anlamlılarını bulur."
        },
        {
            q: "Gizemli bir kelime oyunu oynuyoruz:\n- Bulacağın kelimenin zıt anlamlısı <b>'Cesur'</b>.\n- Aynı kelimenin eş anlamlısı ise <b>'Korkak'</b>.\nBu özelliklere uyan kelime hangisidir?",
            options: ["A) Yürekli", "B) Ürkek", "C) Tembel"], correct: "B) Ürkek", hint: "Hem cesurun zıttı hem de korkağın eş anlamlısı olan kelimeyi arıyorsun.", solution: "Cesurun zıttı korkaktır. Korkağın eş anlamlısı ise 'Ürkek' kelimesidir.", kazanim: "T.3.3.10 ve T.3.3.11'i birlikte değerlendirir."
        }
    ];

    let currentQ = 0; let studentName = ""; let attempts = 0; let scores = []; let currentTotalScore = 0;
    const scrWelcome = document.getElementById('welcome-screen'); const scrQuiz = document.getElementById('quiz-screen');
    const scrMidReport = document.getElementById('mid-report-screen'); const scrReport = document.getElementById('report-screen');

    window.validateName = function() {
        const btn = document.getElementById('startBtn');
        const val = document.getElementById('studentName').value.trim();
        btn.disabled = val.length < 5;
    }

    window.startApp = function() {
        const nameInput = document.getElementById('studentName').value.trim();
        if(nameInput.length >= 5) {
            studentName = nameInput;
            scrWelcome.classList.add('hidden');
            scrQuiz.classList.remove('hidden');
            loadQuestion();
        }
    }

    function loadQuestion() {
        attempts = 0; const q = questions[currentQ];
        document.getElementById('q-num').innerText = `Soru ${currentQ + 1}/10`;
        document.getElementById('progress').style.width = `${(currentQ / 10) * 100}%`;
        document.getElementById('current-score-display').innerText = currentTotalScore;
        document.getElementById('q-text').innerHTML = q.q.replace(/\n/g, '<br>');
        document.getElementById('kazanim').innerText = "Kazanım: " + q.kazanim;
        
        const optsContainer = document.getElementById('options');
        optsContainer.innerHTML = '';
        q.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optsContainer.appendChild(btn);
        });
        
        document.getElementById('feedback').className = 'feedback-box';
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn-container').style.display = 'none';
    }

    function checkAnswer(selected, btn) {
        const q = questions[currentQ];
        const isCorrect = (selected === q.correct);
        const feedbackEl = document.getElementById('feedback');
        const allBtns = document.querySelectorAll('.option-btn');

        if(isCorrect) {
            btn.classList.add('correct');
            allBtns.forEach(b => b.disabled = true);
            let pts = attempts === 0 ? 10 : 7;
            scores.push(pts); currentTotalScore += pts;
            document.getElementById('current-score-display').innerText = currentTotalScore;
            feedbackEl.innerText = attempts === 0 ? "Harika! Doğru bildin." : "Tebrikler! İpucuyla doğru cevabı buldun.";
            feedbackEl.className = 'feedback-box solution';
            triggerConfetti();
            document.getElementById('next-btn-container').style.display = 'block';
        } else {
            btn.classList.add('wrong');
            attempts++;
            if(attempts === 1) {
                feedbackEl.innerText = "Biraz daha düşünelim! İpucu: " + q.hint;
                feedbackEl.className = 'feedback-box hint';
                triggerTear();
                btn.disabled = true;
            } else {
                allBtns.forEach(b => {
                    b.disabled = true;
                    if(b.innerHTML === q.correct) b.classList.add('correct');
                });
                scores.push(0);
                feedbackEl.innerHTML = `<strong>Çözüm:</strong> ${q.solution}`;
                feedbackEl.className = 'feedback-box solution';
                triggerTear();
                document.getElementById('next-btn-container').style.display = 'block';
            }
        }
    }

    window.nextQuestion = function() {
        currentQ++;
        if(currentQ === 5) showMidReport();
        else if (currentQ === 10) { document.getElementById('progress').style.width = '100%'; showFinalReport(); }
        else loadQuestion();
    }

    function showMidReport() {
        scrQuiz.classList.add('hidden');
        scrMidReport.classList.remove('hidden');
        let msg = currentTotalScore === 50 ? "Harika gidiyorsun! Şu ana kadar hiç hata yapmadın. Hepsini bildin! 🌟" :
                 (currentTotalScore >= 35 ? "Çok iyi gidiyorsun! Ufak tefek hatalar olsa da öğrenerek ilerliyorsun. 👍" : 
                 "Daha dikkatli okuyarak devam edebiliriz. Pes etmek yok, harika şeyler başaracaksın! 💪");
        document.getElementById('mid-message').innerText = `Şu ana kadar 5 soruyu tamamladın ve ${currentTotalScore} puan topladın!\n\n` + msg;
    }

    window.continueFromMid = function() {
        scrMidReport.classList.add('hidden'); scrQuiz.classList.remove('hidden'); loadQuestion();
    }

    function showFinalReport() {
        scrQuiz.classList.add('hidden'); scrReport.classList.remove('hidden');
        const firstTry = scores.filter(s => s === 10).length;
        const hintTry = scores.filter(s => s === 7).length;
        const failed = scores.filter(s => s === 0).length;
        document.getElementById('final-name').innerText = studentName;
        document.getElementById('final-score').innerText = currentTotalScore;
        document.getElementById('stat-first').innerText = firstTry;
        document.getElementById('stat-hint').innerText = hintTry;
        document.getElementById('stat-fail').innerText = failed;
        
        let html = '<h3 style="color:#4F46E5; margin-bottom:15px;">Soru Analizi</h3>';
        questions.forEach((q, i) => {
            const p = scores[i];
            let badge = p === 10 ? '✅' : (p === 7 ? '💡' : '❌');
            html += `<div class="review-item"><div class="review-q">${i+1}. ${q.q.replace(/\n/g, ' ')}</div><div class="review-ans">${badge} Doğru Cevap: ${q.correct}</div><div class="review-exp">${q.solution}</div></div>`;
        });
        document.getElementById('review-box').innerHTML = html;
    }

    const emojis = ['🌟', '🎉', '🏅', '✨', '🎈', '🎁', '🏆', '💎'];
    function triggerConfetti() {
        for(let i=0; i<15; i++) {
            let el = document.createElement('div'); el.className = 'floating-emoji'; el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 90 + 'vw'; el.style.top = Math.random() * 20 + 80 + 'vh'; el.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(el); setTimeout(() => el.remove(), 4000);
        }
    }

    const drops = ['🥺', '💧'];
    function triggerTear() {
        for(let i=0; i<5; i++) {
            let el = document.createElement('div'); el.className = 'tear-drop'; el.innerText = drops[Math.floor(Math.random() * drops.length)];
            el.style.left = Math.random() * 50 + 25 + 'vw'; el.style.top = Math.random() * 10 + 'vh'; el.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
            document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
        }
    }
</script>
</body>
</html>
